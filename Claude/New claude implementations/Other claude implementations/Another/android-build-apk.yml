name: Build AutoAlert Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK (command-line tools only, no license handling)
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses (non-interactive using sdkmanager)
        run: |
          mkdir -p ~/.android
          echo "Accepting Android SDK licenses non-interactively..."
          yes "" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          LICENSE_RESULT=$?
          if [ $LICENSE_RESULT -ne 0 ]; then
            echo "ERROR: Failed to accept Android SDK licenses (exit code: $LICENSE_RESULT)"
            exit $LICENSE_RESULT
          fi
          echo "Successfully accepted all Android SDK licenses"

      - name: Install required Android SDK packages
        run: |
          echo "Installing Android SDK components..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.1" \
            "platform-tools" \
            --channel=0
          INSTALL_RESULT=$?
          if [ $INSTALL_RESULT -ne 0 ]; then
            echo "ERROR: Failed to install Android SDK components (exit code: $INSTALL_RESULT)"
            exit $INSTALL_RESULT
          fi
          echo "Successfully installed all required SDK packages"

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -keyalias androiddebugkey \
            -keypass android \
            -storepass android \
            -dname "CN=Debug,O=Debug,C=US" \
            -validity 10000

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK (gradle compilation)
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK file not found at expected location"
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: autoalert-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "Build Status: ${{ job.status }}"
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK: app/build/outputs/apk/debug/app-debug.apk"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          fi
